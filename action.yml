name: Build Quartz Site
description: Build a static site from a Markdown/Obsidian vault with a pinned version of Quartz, without forking Quartz.
author: raven-wing

branding:
  icon: file-text
  color: green

inputs:
  quartz-version:
    description: Quartz git ref to build with (tag, branch or commit SHA of jackyzha0/quartz unless quartz-repository is specified). Pin SHA for reproducible builds.
    required: true
  config:
    description: Path to your quartz.config.yaml, relative to the workspace. Empty uses Quartz's default config.
    default: ""
  directory:
    description: Content (vault) directory, relative to the workspace. Check it out with fetch-depth 0 for git-based dates, use 1 for fastest fetch.
    default: .
  quartz-repository:
    description: Repository to fetch Quartz from, e.g. your own fork.
    default: jackyzha0/quartz

outputs:
  output-dir:
    description: Path of the built site.
    value: ${{ steps.build-wiki.outputs.output-dir }}

runs:
  using: composite
  steps:
    - name: Fetch Quartz
      id: fetch
      shell: bash
      env:
        QUARTZ_VERSION: ${{ inputs.quartz-version }}
        QUARTZ_REPOSITORY: ${{ inputs.quartz-repository }}
      run: |
        dir="$RUNNER_TEMP/quartz"
        rm -rf "$dir"
        git init -q "$dir"
        git -C "$dir" fetch -q --depth 1 "https://github.com/$QUARTZ_REPOSITORY.git" "$QUARTZ_VERSION"
        git -C "$dir" checkout -q FETCH_HEAD
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "node-version=$(cat "$dir/.node-version")" >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.fetch.outputs.node-version }}

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: quartz-npm-${{ runner.os }}-${{ inputs.quartz-repository }}-${{ inputs.quartz-version }}

    - name: Build wiki
      id: build-wiki
      shell: bash
      working-directory: ${{ steps.fetch.outputs.dir }}
      env:
        CONFIG: ${{ inputs.config }}
        CONTENT_DIR: ${{ inputs.directory }}
      run: |
        cd "$GITHUB_WORKSPACE"
        content="$(realpath "$CONTENT_DIR")"
        if [ -n "$CONFIG" ]; then config="$(realpath "$CONFIG")"; fi
        cd - > /dev/null

        # Quartz only reads its config from its own directory; there is no CLI flag for it.
        if [ -n "$CONFIG" ]; then cp "$config" quartz.config.yaml; fi

        out="$RUNNER_TEMP/quartz-public"
        npm ci
        npx quartz plugin install
        npx quartz build --directory "$content" --output "$out"
        echo "output-dir=$out" >> "$GITHUB_OUTPUT"
