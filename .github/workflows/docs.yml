name: Docs site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: page dates come from the last commit that touched each file.
          # 1 is faster, but then every page shows the date of the latest push.
          fetch-depth: 0
          # Nothing here pushes, and that history is read locally. Keeps the token out of
          # .git/config while plugin install runs third-party build scripts.
          persist-credentials: false

      - id: quartz
        uses: ./
        with:
          quartz-version: v5.0.0
          config: docs/quartz.config.yaml
          content-dir: docs/content

      - name: Check output
        run: test -f "${{ steps.quartz.outputs.output-dir }}/index.html"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ steps.quartz.outputs.output-dir }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
