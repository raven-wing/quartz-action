name: Docs site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Per ref, so a push to one PR cannot cancel another's build — or a deploy from main.
  group: docs-site-${{ github.ref }}
  # Superseded PR builds are worth abandoning. Pushes to main are not:
  # this workflow deploys, and a cancelled deployment is worse than a redundant one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: page dates come from the last commit that touched each file.
          # 1 is faster, but then every page shows the date of the latest push.
          fetch-depth: 0
          # Nothing here pushes, and that history is read locally. Keeps the token out of
          # .git/config while npm ci runs third-party install scripts.
          persist-credentials: false

      - id: quartz
        uses: ./
        with:
          quartz-version: 97a2d05f80c4c50534959b1d0d41cc4b3895625e # v5 branch, 2026-09-20
          config: docs/quartz.config.yaml
          content-dir: docs/content

      - name: Check output
        run: test -f "${{ steps.quartz.outputs.output-dir }}/index.html"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.quartz.outputs.output-dir }}

  # The quickstart's starting point is no config at all, and the docs build never takes that
  # path: `config: ""` skips the copy into Quartz's directory and leaves config-path empty.
  # Shallow checkout on purpose — dates do not matter to a smoke test, and it exercises the
  # other fetch-depth.
  build-without-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: quartz
        uses: ./
        with:
          quartz-version: 97a2d05f80c4c50534959b1d0d41cc4b3895625e # v5 branch, 2026-09-20
          content-dir: docs/content

      - name: Check output
        run: test -f "${{ steps.quartz.outputs.output-dir }}/index.html"

  deploy:
    needs: [build, build-without-config]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
