name: Docs site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, so page dates come from commits
          # Page dates read local history; nothing here pushes. Keeps the token out of
          # .git/config while plugin install runs third-party build scripts.
          persist-credentials: false

      - id: quartz
        uses: ./
        with:
          quartz-version: v5.0.0
          config: docs/quartz.config.yaml
          content-dir: docs/content

      - name: Check output
        run: test -f "${{ steps.quartz.outputs.output-dir }}/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.quartz.outputs.output-dir }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
